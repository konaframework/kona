<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; color: #1f2933; }
        .card { border: 1px solid #e4e7eb; border-radius: .5rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
        h1 { color: #3D2914; }
        button { background: #6F4E37; color: #FAF6F0; border: 0; border-radius: .25rem; padding: .25rem .6rem; cursor: pointer; }
        input[type="text"], input:not([type]) { padding: .25rem .5rem; border: 1px solid #cbd2d9; border-radius: .25rem; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .35rem 0; border-bottom: 1px solid #f0f2f5; }
        small { color: #7b8794; font-weight: normal; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    <p>Reactive todos via Brew. Edit <code>app.brew.Todos</code> and <code>views/brew/todos.crema.html</code>.</p>

    <brew:todos />

    <p style="margin-top: 2rem; color: #7b8794; font-size: .9rem;">
        Also try the sample <code>Counter</code> with <code>&lt;brew:counter /&gt;</code> or
        <code>./grind make:brew Counter</code>.
    </p>
</body>
</html>
