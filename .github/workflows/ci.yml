name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance:
    name: Governance files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require locked governance files
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f MILESTONES.md
          test -f README.md
          test -f LICENSE
          test -f docs/architecture/PLAN.md
          test -f docs/architecture/components.md
          test -f docs/governance/github-rulesets.md
          test -f docs/quality/M1-architecture-review.md
          test -f docs/quality/M1-parity-audit.md
          test -f .cursor/rules/kona-milestones.mdc

  test:
    name: Test + 100% coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve sister repo refs
        id: sisters
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          resolve() {
            local repo="$1"
            if [ -n "${HEAD_REF}" ] && git ls-remote --exit-code --heads "https://github.com/${repo}.git" "${HEAD_REF}" >/dev/null 2>&1; then
              echo "${HEAD_REF}"
            else
              echo "main"
            fi
          }
          echo "brew=$(resolve konaframework/kona-brew)" >> "$GITHUB_OUTPUT"
          echo "inertia=$(resolve konaframework/kona-inertia)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: konaframework/kona-brew
          ref: ${{ steps.sisters.outputs.brew }}
          path: .kona-brew
      - uses: actions/checkout@v4
        with:
          repository: konaframework/kona-inertia
          ref: ${{ steps.sisters.outputs.inertia }}
          path: .kona-inertia
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish Kona artifacts to Maven local
        run: ./gradlew publishToMavenLocal -x test --no-configuration-cache
      - name: Publish kona-brew to Maven local (external repo)
        working-directory: .kona-brew
        run: ./gradlew :kona-brew:publishToMavenLocal -x test --no-configuration-cache
      - name: Publish kona-inertia to Maven local (external repo)
        working-directory: .kona-inertia
        run: ./gradlew :kona-inertia:publishToMavenLocal -x test --no-configuration-cache
      - name: Unit tests with Kover verification
        # --rerun-tasks/--no-build-cache: package/group renames and publish-plugin churn
        # invalidate Kover's relationship to cached test outputs from main;
        # UP-TO-DATE hits produce false coverage gaps on CI (same class as #106/#107).
        run: ./gradlew :kona-core:koverVerify :kona-http:koverVerify :kona-grind:koverVerify :kona-cli:koverVerify :kona-cadence:koverVerify :kona-auth:koverVerify :kona-session:koverVerify :kona-support:koverVerify :kona-redis:koverVerify :kona-cache:koverVerify :kona-crema:koverVerify :kona-events:koverVerify :kona-queue:koverVerify :kona-mail:koverVerify :kona-notifications:koverVerify :kona-filesystem:koverVerify :kona-schedule:koverVerify :kona-drip:koverVerify :kona-process:koverVerify :kona-concurrency:koverVerify :kona-testing:koverVerify :kona-broadcasting:koverVerify :kona-search:koverVerify :kona-lsp:koverVerify test --rerun-tasks --no-build-cache
      - name: Sample apps (HTTP smoke)
        run: ./gradlew :hello-kotlin:test :hello-java:test
