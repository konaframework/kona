name: Cloudflare Pages

# Primary docs host: https://docs.konaframework.org
#
# First publish (no GitHub secrets required):
#   Cloudflare Dashboard → Workers & Pages → project "kona" → Settings → Builds
#   Framework preset: None (not Astro)
#   Root: / · Build: pnpm install --frozen-lockfile && pnpm docs:build
#   Deploy: npx wrangler deploy --config apps/docs/wrangler.jsonc
#   NODE_VERSION=22 · PUBLIC_SITE_URL / PUBLIC_BASE_PATH
#   Do NOT use npm ci; do NOT use wrangler pages deploy (Workers Assets, not Pages).
#   Details: docs/governance/docs-site.md
#   Custom domain docs.konaframework.org. No CLOUDFLARE_* secrets required for Path A.
#
# Optional harden (this workflow's deploy step):
#   CLOUDFLARE_API_TOKEN   — API token with Cloudflare Pages Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
# When unset, this workflow still builds docs on main (smoke) and skips Wrangler deploy.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        env:
          PUBLIC_SITE_URL: https://docs.konaframework.org
          PUBLIC_BASE_PATH: /
        run: pnpm docs:build

      - name: Check optional Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_* GitHub secrets — build-only. Deploy via Cloudflare Git integration or dashboard; see docs/governance/docs-site.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers (static assets)
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
