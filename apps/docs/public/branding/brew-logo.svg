<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Brew">
  <title>Brew</title>
  <!--
    Concept: the letter b IS a coffee mug.
    Tall stem + rounded mug body + left handle + right handle (b bowl),
    dark coffee oval, cream { } badge. Flat terracotta. Transparent 1:1.
  -->
  <g fill="#B86B3E">
    <!-- Unified stem + mug body (rounded base spans full width under stem) -->
    <path d="
      M54 5
      H65
      V84
      C65 90.6 59.6 95 53 95
      H36
      C29.4 95 24 90.6 24 84
      V38
      H54
      V5Z"/>
    <!-- Left handle -->
    <path fill-rule="evenodd" d="
      M24 44
      C9 44 7 54 7 65
      C7 76 9 86 24 86
      V78.5
      C15.5 78.5 15.5 72 15.5 65
      C15.5 58 15.5 51.5 24 51.5
      V44Z"/>
    <!-- Right handle = bowl of b -->
    <path fill-rule="evenodd" d="
      M65 44
      C80 44 82 54 82 65
      C82 76 80 86 65 86
      V78.5
      C73.5 78.5 73.5 72 73.5 65
      C73.5 58 73.5 51.5 65 51.5
      V44Z"/>
  </g>
  <!-- Coffee surface -->
  <ellipse cx="39.5" cy="41.5" rx="12" ry="5.2" fill="#1A0D0A"/>
  <!-- Cream code badge -->
  <rect x="32.5" y="51" width="14" height="30" rx="2.4" fill="#F4E1C1"/>
  <g fill="none" stroke="#1A0D0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 58C34 58 33.2 61.5 33.2 66C33.2 70.5 34 74 36 74"/>
    <path d="M43 58C45 58 45.8 61.5 45.8 66C45.8 70.5 45 74 43 74"/>
  </g>
</svg>
