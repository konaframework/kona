<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 120" fill="none" role="img" aria-label="Brew">
  <title>Brew</title>
  <!-- Wordmark: cup+b lockup + Outfit-weight rew. Transparent background. -->
  
  <defs>
    <linearGradient id="copperBody-bl" x1="14" y1="14" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8B078"/>
      <stop offset="0.4" stop-color="#D48C46"/>
      <stop offset="1" stop-color="#A85528"/>
    </linearGradient>
    <linearGradient id="copperB-bl" x1="70" y1="12" x2="102" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8B078"/>
      <stop offset="0.45" stop-color="#D48C46"/>
      <stop offset="1" stop-color="#8F4A20"/>
    </linearGradient>
    <linearGradient id="rim-bl" x1="16" y1="16" x2="62" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0C090"/>
      <stop offset="1" stop-color="#BA622A"/>
    </linearGradient>
  </defs>

  <!-- Cylindrical mug (three-quarter rim) -->
  <path fill="url(#copperBody-bl)" d="M16 32C16 22 28 16 40 16C52 16 64 22 64 32L61 96C61 104 52 110 40 110C28 110 19 104 19 96Z"/>
  <ellipse cx="40" cy="32" rx="24" ry="9" fill="url(#rim-bl)"/>
  <ellipse cx="40" cy="32" rx="17.5" ry="6" fill="#2A1C12"/>

  <!-- Cream braces printed ON the mug body -->
  <g fill="none" stroke="#FAEDCD" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 52C25.8 52 24.5 56.5 24.5 61C24.5 65.5 25.8 70 30 70"/>
    <path d="M50 52C54.2 52 55.5 56.5 55.5 61C55.5 65.5 54.2 70 50 70"/>
  </g>

  <!--
    Lowercase b integrated with cup:
    - Stem to the right of the mug
    - Bowl curves left and joins mug wall at x≈61 (real handle attachment)
    - evenodd counter = handle opening
    - leftward foot at stem base
  -->
  <path fill="url(#copperB-bl)" fill-rule="evenodd" d="M76 14H92V110H76V102H64V94H76V74C76 74 70 76 61 68C54 62 54 46 61 40C70 32 76 34 76 34V14ZM76 42C76 42 68 44 64 50C61 54 61 60 64 64C68 70 76 68 76 68V42Z"/>

  <g fill="#BA622A">
  <!-- r -->
  <path d="M102 110V52h12.5v11.2c3.8-7.2 9.6-11.5 18.2-11.5v13.2c-7.4.2-18.2 3.6-18.2 14.2V110z"/>
  <!-- e -->
  <path d="M142.5 81.5h39.5c-.8-14.5-9.8-31.5-20.8-31.5-14.2 0-22.5 12.2-22.5 30.2 0 18.2 10.2 31.8 26.2 31.8 10.2 0 18.2-5.8 22.2-14.2l-11-7.5c-2.2 4.2-6.2 7.5-11.5 7.5-9.5 0-14.8-7.8-14.8-16.3zm6.2-10.2c1.8-8.2 6.2-14.2 12.5-14.2 6.2 0 10.2 5.8 10.5 14.2z"/>
  <!-- w -->
  <path d="M194 52h14.2l8.5 42.5 8.8-42.5H240l-13.5 58H210l-7.8-34.5L194.2 110H178z"/>
</g>
</svg>
